name: Build Mobile BIM Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-build.yml"
      - "mobilebim-v0.8.tar.xz"
      - "MobileBIM-Android-v0.8-source.zip"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "app/**"
      - "core/**"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source tree
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle.kts && -d app && -d core ]]; then
            echo "Android source tree already present"
          elif [[ -f mobilebim-v0.8.tar.xz ]]; then
            tar -tJf mobilebim-v0.8.tar.xz > /dev/null
            tar -xJf mobilebim-v0.8.tar.xz
            test -f settings.gradle.kts || { echo "::error::Archive missing settings.gradle.kts"; exit 1; }
          elif [[ -f MobileBIM-Android-v0.8-source.zip ]]; then
            unzip -tq MobileBIM-Android-v0.8-source.zip
            mkdir -p .source-extract
            unzip -q MobileBIM-Android-v0.8-source.zip -d .source-extract
            cp -a .source-extract/MobileBIM-Android-v0.8/. ./
          else
            echo "::error::No Mobile BIM v0.8 source code or source archive found"
            exit 1
          fi
          test -f app/build.gradle.kts
          test -f core/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify BIM core
        run: gradle --no-daemon :core:test --stacktrace
      - name: Build Android debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileBIM-v0.8-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
