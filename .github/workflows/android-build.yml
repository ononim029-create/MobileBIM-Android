name: Build Mobile BIM Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source tree
        shell: bash
        run: |
          if [[ -f settings.gradle.kts ]]; then
            echo 'Using source files in repository root'
          elif [[ -f MobileBIM-Android-v0.8-source.zip ]]; then
            mkdir -p .source-extract
            unzip -q MobileBIM-Android-v0.8-source.zip -d .source-extract
            cp -a .source-extract/MobileBIM-Android-v0.8/. ./
          else
            echo 'Error: source tree or MobileBIM-Android-v0.8-source.zip missing' >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify BIM core
        run: gradle --no-daemon :core:test --stacktrace
      - name: Build Android debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileBIM-v0.8-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
