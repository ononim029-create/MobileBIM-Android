name: Publish Mobile BIM v0.8 APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download tested Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41206008619 --repo "${{ github.repository }}" -n MobileBIM-v0.8-debug-apk -D dist
          test -s dist/app-debug.apk
          ls -lh dist/app-debug.apk
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.8.0-preview "dist/app-debug.apk#MobileBIM-v0.8-debug.apk" --repo "${{ github.repository }}" --target main --title "Mobile BIM v0.8 — Android Preview" --notes "First successfully compiled Android debug APK. Kotlin BIM core tests passed (45 tests). Device installation and runtime have not yet been verified. Test build only." --prerelease
